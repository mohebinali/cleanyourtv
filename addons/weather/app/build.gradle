plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.sumyabazar1.weather'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.sumyabazar1.weather'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    // One fixed key, so a later build installs over this one instead of being refused.
    signingConfigs {
        shared {
            storeFile file('../signing/weather.p12')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Sideloaded over ADB like the launcher: signed with the debug key. Sign your own releases with your key.
            signingConfig signingConfigs.shared
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Test only (never in the APK): plain JVM tests for the code and AQI tables, src/test.
    testImplementation 'junit:junit:4.13.2'
}
