name: Build Homes

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - 'afnon/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already ships the Android SDK.
      - name: Show the SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Build the normal home (launcher)
        working-directory: launcher
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Fatal on purpose: without the recordings, afnon.apk puts up a silent call to prayer.
      - name: Fetch adhan audio
        working-directory: afnon
        run: bash tools/fetch-adhans.sh

      - name: Build the prayer home (afnon)
        working-directory: afnon
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build the Weather add-on
        working-directory: addons/weather
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect both APKs
        run: |
          mkdir -p out
          cp "$(find launcher/app/build/outputs/apk/release -name '*.apk' | head -1)" out/tvhome.apk
          cp "$(find afnon/app/build/outputs/apk/debug   -name '*.apk' | head -1)" out/afnon.apk
          echo "--- weather add-on outputs ---"
          ls -la addons/weather/app/build/outputs/apk/release/
          cp addons/weather/app/build/outputs/apk/release/app-release.apk out/weather.apk
          ls -la out/
          # A release APK with no classes.dex is a stripped intermediate, not an app: fail here
          # rather than publishing something that cannot install.
          for a in out/*.apk; do
            unzip -l "$a" | grep -q classes.dex || { echo "ERROR: $a has no code"; exit 1; }
          done
          # afnon.apk must carry every recording on fetch-adhans.sh's list, or a prayer set to a
          # missing voice comes up silent. Counting from that list means a new voice needs no edit here.
          # "|| true": grep -c exits 1 on a count of 0, and bash -e would quit before the message.
          want=$(sed -n '/<<.LIST.$/,/^LIST$/p' afnon/tools/fetch-adhans.sh | grep -c '|' || true)
          have=$(unzip -l out/afnon.apk | grep -c 'assets/adhan/.*\.mp3$' || true)
          [ "$want" -gt 0 ] && [ "$have" -eq "$want" ] || { echo "ERROR: afnon.apk has $have of $want adhan recordings"; exit 1; }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: homes
          path: out/*.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: homes-${{ github.run_number }}
          name: Homes build ${{ github.run_number }}
          files: |
            out/tvhome.apk
            out/afnon.apk
            out/weather.apk
