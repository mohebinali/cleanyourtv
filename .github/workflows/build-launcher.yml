name: Build Launcher

on:
  push:
    branches: [main]
    paths:
      - 'launcher/**'
      - '.github/workflows/build-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: launcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image already has the Android SDK; no setup action needed.
      - name: Show the SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || true

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Collect the APK
        run: |
          mkdir -p out
          APK="$(find app/build/outputs/apk/release -name '*.apk' | head -1)"
          echo "built: $APK"
          cp "$APK" out/tvhome.apk
          ls -la out/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvhome-apk
          path: launcher/out/tvhome.apk
          retention-days: 30

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tvhome-${{ github.run_number }}
          name: TV Home build ${{ github.run_number }}
          files: launcher/out/tvhome.apk
